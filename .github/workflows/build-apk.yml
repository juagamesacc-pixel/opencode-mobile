name: Build Android APK (arm64-v8a)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project (CNG)
        run: npx expo prebuild --platform android --no-install

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-rn088

      - name: Build release APK (arm64-v8a only)
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --stacktrace

      - name: Verify APK ABI
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/" || echo "no native libs bundled (JS-only APK)"
          if unzip -l "$APK" | grep -E "lib/(armeabi|x86|mips)"; then
            echo "::error::non-arm64 ABIs found in APK"; exit 1
          fi

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if gh release view latest-apk --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-apk "$APK#opencode-mobile-arm64-v8a.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest-apk "$APK#opencode-mobile-arm64-v8a.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "OpenCode Mobile APK (arm64-v8a)" \
              --notes "Automated build from run #${{ github.run_number }} ($(date -u +%Y-%m-%dT%H:%MZ))"
          fi
